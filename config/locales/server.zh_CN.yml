zh_CN:
  site_settings:
    mute_enhancements_enabled: "打开免打扰增强插件。具体功能由下面几个设置分别控制。"
    mute_enhancements_search_muted_tags: "搜索结果中隐藏带有用户已设为免打扰的标签的话题，搜索结果的标签部分也不显示这些标签。还需要打开 tagging_enabled。"
    mute_enhancements_search_muted_categories: "搜索结果中隐藏用户已设为免打扰的类别（包括免打扰类别的子类别）里的话题，搜索结果的类别部分也不显示这些类别。"
    mute_enhancements_search_ignored_users: "搜索结果中隐藏用户已忽略的那些用户发的帖子和他们创建的话题，搜索结果的用户部分也不显示他们。管理员和版主不会被隐藏。"
    mute_enhancements_search_muted_users: "和忽略的用户一样，在搜索结果中隐藏用户已设为免打扰的那些用户。管理员和版主不会被隐藏。"
    mute_enhancements_hide_invisible_group_users: "用户资料接口（例如 /u/用户名.json）的 group_users 只列出用户能看到的群组，不暴露用户所在、但对他不可见的群组的 ID。管理员仍能看到全部。"
    mute_enhancements_group_mutes: "允许用户在 个人设置 → 用户 里把整个群组设为免打扰或忽略，群组里的成员（管理员和版主除外）随之被设为免打扰或忽略，以后加入的成员自动生效，退出的成员自动取消。"
    mute_enhancements_group_default_users: "允许管理员在群组的 管理 → 用户偏好 页面设置新成员默认免打扰和忽略的用户；同时打开 mute_enhancements_group_mutes 时，还可以设置默认免打扰和忽略的群组。"
    mute_enhancements_group_hide_preferences: "允许管理员在群组的 管理 → 用户偏好 页面，对这个群组的成员（管理员和版主除外）隐藏个人设置里的“通知”“跟踪”和“用户”页面，每个页面分别设置。默认都不隐藏。"
    mute_enhancements_group_muted_topics: "允许管理员在群组的 管理 → 用户偏好 页面填写话题 ID，把这个群组所有成员对这些话题的通知级别设为免打扰，以后加入的成员也会设上。成员之后可以自己改回来。"
    mute_enhancements_group_hide_ignored_topics: "允许管理员在群组的 管理 → 用户偏好 页面，给这个群组的成员（包括以后加入的）打开 enhanced-ignore 插件的“不在我的主题列表中显示被屏蔽用户发表的话题帖”。成员之后可以自己关掉。需要安装并打开 enhanced-ignore 插件。"
  mute_enhancements:
    errors:
      staff_default_users: "管理员和版主不能被设为免打扰或忽略：%{usernames}"
      invalid_default_groups: "这些群组不能设为默认屏蔽的群组：%{groups}。不能选自动群组或这个群组本身。"
      invalid_muted_topics: "找不到这些话题：%{topics}。每行填一个话题 ID，不能填私信。"
