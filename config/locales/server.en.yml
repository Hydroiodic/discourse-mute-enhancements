en:
  site_settings:
    mute_enhancements_enabled: "Enable the mute enhancements plugin. The settings below turn each feature on or off."
    mute_enhancements_search_muted_tags: "Hide topics with tags the user muted from search results, and leave those tags out of the tags section of the results. Also requires tagging_enabled."
    mute_enhancements_search_muted_categories: "Hide topics in categories the user muted (including subcategories of muted categories) from search results, and leave those categories out of the categories section of the results."
    mute_enhancements_search_muted_topics: "Hide topics the user muted (including topics muted for the members of a group) from search results."
    mute_enhancements_search_ignored_users: "Hide posts by users the user ignored, and topics they started, from search results, and leave them out of the users section of the results. Admins and moderators are never hidden."
    mute_enhancements_search_muted_users: "Like ignored users, hide users the user muted from search results. Admins and moderators are never hidden."
    mute_enhancements_hide_invisible_group_users: "Only list groups the user can see in group_users of the user profile API (such as /u/username.json), so it does not reveal the IDs of groups the user is in but cannot see. Admins still get the full list."
    mute_enhancements_group_mutes: "Let users mute or ignore whole groups in Preferences → Users. The group's members (except admins and moderators) are muted or ignored, members who join later are too, and members who leave no longer are."
    mute_enhancements_group_default_users: "Let admins choose, on a group's Manage → Member preferences page, users that new members of the group mute or ignore by default, and groups too when mute_enhancements_group_mutes is enabled."
    mute_enhancements_group_hide_preferences: "Let admins hide the Notifications, Tracking and Users pages of the preferences from a group's members (except admins and moderators), each on its own, on the group's Manage → Member preferences page. None are hidden by default."
    mute_enhancements_group_muted_topics: "Let admins enter topic IDs on a group's Manage → Member preferences page to set the notification level of every member of the group to Muted for those topics, and of members who join later too. Members can change it back themselves."
    mute_enhancements_group_enhanced_ignore: "Let admins turn on the two options of the enhanced-ignore plugin for a group's members, including members who join later, each on its own, on the group's Manage → Member preferences page. Members can turn them off themselves. Requires the enhanced-ignore plugin to be installed and enabled."
  mute_enhancements:
    errors:
      staff_default_users: "Admins and moderators cannot be muted or ignored: %{usernames}"
      invalid_default_groups: "These groups cannot be muted or ignored by default: %{groups}. Automatic groups and the group itself cannot be chosen."
      invalid_muted_topics: "These topics were not found: %{topics}. Enter one topic ID per line; personal messages cannot be added."
